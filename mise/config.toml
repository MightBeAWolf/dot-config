[tools]
usage = "latest"

[tasks.hermes]
description = "Launch the Hermes agent container"
usage = 'arg "[args]" var=#true help="Arguments to pass to the container"'
run="""
  podman run -it --rm \
  --hostname hermes \
  -v {{ cwd }}:/workspace:Z \
  -v $HOME/.hermes:/root/.hermes:Z \
  -v $HOME/.gitconfig:/root/.gitconfig:ro,z \
  -v /etc/localtime:/etc/localtime:ro \
  hermes:latest ${usage_args}
"""


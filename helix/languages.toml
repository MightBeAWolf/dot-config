use-grammars = { except = ["gemini"] }

[language-server.typos]
# typos-lsp must be on your PATH, or otherwise change this to an absolute path to typos-lsp
command = "typos-lsp"
# Logging level of the language server. Defaults to error.
# Run with helix -v to output LSP logs to the editor log (:log-open)
environment = {"RUST_LOG" = "error"}
# Custom config. Used together with a config file found in the workspace or its parents,
# taking precedence for settings declared in both. Equivalent to the typos `--config` cli argument.
config.config = "~/.config/typos-lsp/typos.toml"
# How typos are rendered in the editor, can be one of an Error, Warning, Info or Hint.
# Defaults to Info.
config.diagnosticSeverity = "Info"

[language-server.ruff]
command = "ruff"
args = ["server", "--config","line-length=80"]

[[language]]
name = "python"
scope = "source.python"
language-servers = [ "ruff" ]

[[language]]
name = "markdown"
language-servers = ["marksman", "markdown-oxide", "typos"]

[[language]]
name = "rust"
auto-format = true
formatter = { command = "cargo", args = ["fmt", "--", "--stdin"] }
language-servers = ["rust-analyzer"]

[language-server.rust-analyzer]
command = "rust-analyzer"

# Ask rust-analyzer to run Clippy when checking (stronger diagnostics)
[language-server.rust-analyzer.config.check]
command = "clippy"

[[language]]
name = "bash"
language-servers = ["bash-language-server"]
auto-format = true

[language-server.bash-language-server]
command = "bash-language-server"
args = ["start"]
environment = { NODE_OPTIONS = "--no-deprecation" }

[language-server.bash-language-server.config.bashIde]
# quiet the server's own chatter — it all lands in your log as [ERROR]
logLevel = "warning"

# background analysis: 500 files by default, 0 disables it entirely
backgroundAnalysisMaxFiles = 500

# widen if you edit extensionless scripts or odd suffixes
globPattern = "**/*@(.sh|.inc|.bash|.command)"

# shellcheck
shellcheckPath = "shellcheck"          # empty string disables linting
shellcheckArguments = "-e SC1091"      # --shell/--format/--external-sources already passed

# shfmt (this is what gives you :format)
shfmt.path = "shfmt"                   # empty string disables formatting
shfmt.languageDialect = "bash"         # auto | bash | posix | mksh | bats
shfmt.simplifyCode = false
shfmt.caseIndent = true
shfmt.spaceRedirects = true
shfmt.ignoreEditorconfig = false       # leave false if you have .editorconfig

